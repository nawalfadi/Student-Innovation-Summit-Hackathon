spring:
  application:
    name: sish-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB
management:
  endpoints:
    web:
      exposure:
        include: health